name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # weekly run for dependency checks

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Install any npm dependencies if package.json exists
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm ci; else echo "No package.json, skipping npm install"; fi

      # Run unit / integration tests if defined
      - name: Run tests
        run: |
          npm test

      - name: Build Node.js API
        run: npm run typecheck:api && npm run build:api

      # Lint HTML files using htmlhint
      # supabase/templates/** 是 Supabase Auth 的信件範本，不是網站頁面——它們是
      # 刻意不帶 doctype 的片段（主控台會把內容包進信件本體），套網頁規則只會拿到
      # 六個 doctype-first 假警報。
      - name: Lint HTML with htmlhint
        run: |
          npx htmlhint "**/*.html" --ignore "google620de73073c56d88.html,supabase/templates/**"

      # Validate HTML semantics using html-validate
      - name: Validate HTML semantics
        run: |
          # 只驗證本專案的 38 個正式網站頁面，避免把 npm 套件內附的範例 HTML
          # 誤判成本站頁面（例如 node_modules/terser/tools/props.html）。
          npx -y html-validate "index.html" "system/*.html"

      # Lint CSS files using stylelint
      - name: Lint CSS with stylelint
        run: |
          npx stylelint "system/*.css" --allow-empty-input

      # Lint JavaScript files using ESLint
      - name: Lint JavaScript with ESLint
        run: |
          npx eslint . --ext .js,.html || true

      # login.html contains the production authentication flow as inline JS.
      # Compile every inline script so a missing brace cannot reach GitHub Pages.
      - name: Validate login JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('system/login.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('No inline login script found');
          scripts.forEach((match, index) => new vm.Script(match[1], { filename: `system/login.html:inline-${index + 1}` }));
          console.log(`Validated ${scripts.length} inline login script(s)`);
          NODE

      # Check for broken links and images
      - name: Check broken links and images
        run: |
          npx -y broken-link-checker . || true

      # Verify Subresource Integrity hashes (optional helper)
      - name: Verify SRI hashes
        run: |
          # Simple check: ensure script tags with external src contain integrity attribute
          grep -R "<script src=\"https://" -n . | grep -v "integrity" && echo "Missing integrity detected" || echo "All external scripts have integrity attributes"
        shell: bash

      - name: Scan public pages for server secrets
        run: npm run security:secrets

      # Dependency freshness check
      - name: Check outdated npm dependencies
        run: |
          npm outdated || echo "Dependencies are up‑to‑date"
        continue-on-error: true
