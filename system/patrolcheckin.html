<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<noscript><meta http-equiv="refresh" content="0; url=/Inspection/v2/systems/guardpatrol/checkins/"></noscript>
<title>V2 巡檢打卡 — 臺北農產公司 V2</title>
<script src="patrol-offline.js?v=20260906"></script>
<script>
  (async function() {
    var target = "/Inspection/v2/systems/guardpatrol/checkins/" + window.location.search + window.location.hash;
    // 舊版巡檢入口仍須隔離離線佇列，並解除它自己註冊的快取，才前往 V2。
    try {
      await window.PatrolOffline?.sync({});
      if ('serviceWorker' in navigator) {
        var registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.filter(function(registration) {
          return [registration.active, registration.waiting, registration.installing].some(function(worker) {
            return worker && new URL(worker.scriptURL).pathname === '/Inspection/system/patrol-service-worker.js';
          });
        }).map(function(registration) { return registration.unregister(); }));
      }
      if ('caches' in window) {
        var keys = await caches.keys();
        await Promise.all(keys.filter(function(key) { return key.startsWith('patrol-checkin-'); })
          .map(function(key) { return caches.delete(key); }));
      }
    } catch (error) { console.warn('舊版巡檢離線資料隔離或快取清理失敗', error); }
    window.location.replace(target);
  })();
  </script>
<style>
  body {
    margin: 0; min-height: 100vh; background: #020b18; color: #00d4ff;
    font-family: system-ui, -apple-system, sans-serif; display: flex;
    align-items: center; justify-content: center; text-align: center;
  }
  .box { padding: 32px; background: #05101e; border: 1px solid #0c2840; border-radius: 12px; max-width: 440px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .spinner { width: 36px; height: 36px; border: 3px solid rgba(0,212,255,0.2); border-top-color: #00d4ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  a { color: #00ff9d; font-weight: bold; text-decoration: underline; font-size: 0.95rem; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <h2 style="font-size: 1.15rem; margin: 0 0 10px; color: #d4eeff;">系統已全面升級至 V2</h2>
  <p style="font-size: 0.85rem; color: #a8d8f0; margin: 0 0 20px;">正在為您自動跳轉至 V2 巡檢打卡…</p>
  <a href="/Inspection/v2/systems/guardpatrol/checkins/">點此立即前往</a>
</div>
</body>
</html>
